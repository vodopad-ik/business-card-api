services:
  - type: web
    name: business-card-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: business-card-db
          property: connectionString

databases:
  - name: business-card-db
    plan: free
    region: frankfurt
    databaseName: business_card
    user: postgres
